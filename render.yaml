services:
  - type: web
    name: filament-project-manager
    env: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: "Inventory Management System for Soltem"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: filament-project-manager-db
          property: connectionString
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: array
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

databases:
  - name: filament-project-manager-db
    plan: free
    databaseName: filament_project_manager
